    <script>
      // SPA redirect handling for GitHub Pages (404.html -> "/?/<path>").
      // Based on https://github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location;
        if (l.search.startsWith("?/")) {
          var raw = l.search.replace(/^\?\/(?:&\/)+/, "?/");
          var decoded = raw
            .slice(2)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          if (!decoded) {
            window.history.replaceState(
              null,
              null,
              l.pathname.replace(/\/$/, "") + "/" + l.hash
            );
          } else {
            window.history.replaceState(
              null,
              null,
              l.pathname.replace(/\/$/, "") + "/" + decoded + l.hash
            );
          }
        }
      })();
    </script>
