<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages.
      // Based on https://github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location;
        var repo = "/founder-friendship-forge";
        var pathRest = l.pathname.slice(repo.length + 1).replace(/^\/+/, "");
        pathRest = pathRest.replace(/&/g, "~and~");
        var q = l.search || "";
        // If search is already ?/… (SPA hack), appending & + search caused ?/&/… and unbounded growth.
        var target;
        if (q.startsWith("?/") && !pathRest) {
          target = l.protocol + "//" + l.host + repo + "/" + q + l.hash;
        } else {
          target =
            l.protocol +
            "//" +
            l.host +
            repo +
            "/?/" +
            pathRest +
            (q && !q.startsWith("?/") ? "&" + q.slice(1).replace(/&/g, "~and~") : "") +
            l.hash;
        }
        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
