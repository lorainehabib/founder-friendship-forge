<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var l = window.location;
        // SPA fallback for GitHub Pages (custom domain).
        // Based on https://github.com/rafgraph/spa-github-pages
        var pathname = l.pathname || "/";
        var pathRest = pathname.replace(/^\/+/, "");
        pathRest = pathRest.replace(/&/g, "~and~");
        var q = l.search || "";
        var target;

        if (q.startsWith("?/") && !pathRest) {
          target = l.protocol + "//" + l.host + "/" + q + l.hash;
        } else if (pathRest) {
          target =
            l.protocol +
            "//" +
            l.host +
            "/?/" +
            pathRest +
            (q && !q.startsWith("?/") ? "&" + q.slice(1).replace(/&/g, "~and~") : "") +
            l.hash;
        } else if (!q) {
          target = l.protocol + "//" + l.host + "/" + l.hash;
        } else {
          target = l.protocol + "//" + l.host + "/?/&" + q.slice(1).replace(/&/g, "~and~") + l.hash;
        }

        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
