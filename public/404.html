<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages.
      // Based on https://github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location;
        var repo = "/founder-friendship-forge";
        l.replace(
          l.protocol +
            "//" +
            l.host +
            repo +
            "/?/" +
            l.pathname.slice(repo.length + 1) +
            (l.search ? "&" + l.search.slice(1) : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
